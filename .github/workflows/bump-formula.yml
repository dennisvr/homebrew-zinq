# Bump the zinq formula to a new version and set the four release checksums.
#
# Private CI in the source repo (dennisvr/galvanized) is expected to build the
# per-platform binaries, compute their sha256 checksums, create the GitHub
# Release on this repo with the tarballs attached, and then trigger this
# workflow (workflow_dispatch) with the version and checksums as inputs.
name: Bump formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0"
        required: true
      sha256_arm64_darwin:
        description: "sha256 for zinq-<version>-arm64-apple-darwin.tar.gz"
        required: true
      sha256_x86_64_darwin:
        description: "sha256 for zinq-<version>-x86_64-apple-darwin.tar.gz"
        required: true
      sha256_x86_64_linux:
        description: "sha256 for zinq-<version>-x86_64-linux.tar.gz"
        required: true
      sha256_aarch64_linux:
        description: "sha256 for zinq-<version>-aarch64-linux.tar.gz"
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite Formula/zinq.rb
        env:
          VERSION: ${{ inputs.version }}
          SHA_ARM64_DARWIN: ${{ inputs.sha256_arm64_darwin }}
          SHA_X86_64_DARWIN: ${{ inputs.sha256_x86_64_darwin }}
          SHA_X86_64_LINUX: ${{ inputs.sha256_x86_64_linux }}
          SHA_AARCH64_LINUX: ${{ inputs.sha256_aarch64_linux }}
        run: |
          ruby - <<'RUBY'
          f = "Formula/zinq.rb"
          s = File.read(f)

          version = ENV.fetch("VERSION")
          sums = {
            "arm64-apple-darwin"  => ENV.fetch("SHA_ARM64_DARWIN"),
            "x86_64-apple-darwin" => ENV.fetch("SHA_X86_64_DARWIN"),
            "x86_64-linux"        => ENV.fetch("SHA_X86_64_LINUX"),
            "aarch64-linux"       => ENV.fetch("SHA_AARCH64_LINUX"),
          }

          s.sub!(/version "[^"]*"/, %Q(version "#{version}"))

          sums.each do |platform, sha|
            # Set the sha256 that follows the url for this platform's tarball.
            s.sub!(
              /(zinq-\#{version}-#{Regexp.escape(platform)}\.tar\.gz"\s*\n\s*sha256 ")[^"]*(")/,
              "\\1#{sha}\\2"
            )
          end

          File.write(f, s)
          RUBY

      - name: Commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/zinq.rb
          git commit -m "zinq ${VERSION}" || echo "No changes to commit"
          git push